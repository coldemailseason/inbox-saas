services:
  web:
    ports:
      - "${WEB_PORT:-80}:80"

  server:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:?POLAR_ACCESS_TOKEN is required}
      POLAR_SUCCESS_URL: ${POLAR_SUCCESS_URL:?POLAR_SUCCESS_URL is required}
      TENANT_CREDENTIAL_ENCRYPTION_KEY: ${TENANT_CREDENTIAL_ENCRYPTION_KEY:?TENANT_CREDENTIAL_ENCRYPTION_KEY is required}
      TENANT_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${TENANT_CREDENTIAL_ENCRYPTION_KEY_VERSION:?TENANT_CREDENTIAL_ENCRYPTION_KEY_VERSION is required}

  migrate:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  worker:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TENANT_CREDENTIAL_ENCRYPTION_KEY: ${TENANT_CREDENTIAL_ENCRYPTION_KEY:?TENANT_CREDENTIAL_ENCRYPTION_KEY is required}
      TENANT_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${TENANT_CREDENTIAL_ENCRYPTION_KEY_VERSION:?TENANT_CREDENTIAL_ENCRYPTION_KEY_VERSION is required}
      PROVISIONER_BASE_URL: http://provisioner:8000
      INBOX_PROVISIONER_SIGNING_SECRET: ${INBOX_PROVISIONER_SIGNING_SECRET:?INBOX_PROVISIONER_SIGNING_SECRET is required}
      INBOX_PROVISIONER_TRANSPORT_ENCRYPTION_KEY: ${INBOX_PROVISIONER_TRANSPORT_ENCRYPTION_KEY:?INBOX_PROVISIONER_TRANSPORT_ENCRYPTION_KEY is required}

  provisioner:
    environment:
      INBOX_PROVISIONER_SIGNING_SECRET: ${INBOX_PROVISIONER_SIGNING_SECRET:?INBOX_PROVISIONER_SIGNING_SECRET is required}
      INBOX_PROVISIONER_TRANSPORT_ENCRYPTION_KEY: ${INBOX_PROVISIONER_TRANSPORT_ENCRYPTION_KEY:?INBOX_PROVISIONER_TRANSPORT_ENCRYPTION_KEY is required}
      INBOX_PROVISIONER_HEADLESS_BROWSER: "true"
