[project]
name = "inbox-provisioner"
version = "0.1.0"
description = "Private tenant validation provisioner"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  "zendriver>=0.16.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_provisioner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
