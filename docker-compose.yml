name: inbox-saas

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: builder
    working_dir: /app/packages/db
    command: pnpm db:migrate:deploy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  provisioner:
    build:
      context: .
      dockerfile: apps/provisioner/Dockerfile
    init: true
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - provisioner_private
      - provisioner_egress

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      provisioner:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - provisioner_private

networks:
  provisioner_private:
    internal: true
  provisioner_egress:
    internal: false
